<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Assignment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>CSS Box Model Demonstration</h1>
    
    <div class="box">
        This is the content area of the box.
        <br><br>
        Padding is inside the border.<br>
        Border surrounds the padding.<br>
        Margin is outside the border.
    </div>

    <p class="instructions">
        ✅ Right-click on the box and select <strong>Inspect</strong> (or press F12) to see the Box Model in Developer Tools.
    </p>
</body>
</html>
